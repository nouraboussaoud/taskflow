name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint, tests, migrations, audit
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: taskflow_ci
          MYSQL_USER: taskflow_ci
          MYSQL_PASSWORD: ci-only-database-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci-only-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: taskflow_ci
      DB_USER: taskflow_ci
      DB_PASSWORD: ci-only-database-password
      JWT_SECRET_KEY: ci-only-jwt-signing-key-not-for-real-use
      FRONTEND_ORIGIN: http://localhost:5173
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies and audit tool
        run: python -m pip install -r requirements-dev.txt pip-audit
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      # Pytest uses isolated SQLite fixtures; this also checks the real MySQL migration path.
      - name: Apply and inspect MySQL migrations
        run: |
          alembic upgrade head
          alembic current
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: Frontend lint, tests, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  images:
    name: Build and scan ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build local image
        run: docker build --tag taskflow-${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Scan image (high and critical findings fail)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-${{ matrix.service }}:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          # Keep blocking findings that have an available remediation. Unfixed upstream
          # base-image findings remain documented and are reviewed during dependency updates.
          ignore-unfixed: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
