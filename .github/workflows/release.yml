name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    name: Run CI before publishing
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.service }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and image name
        id: image
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "name=ghcr.io/${OWNER,,}/taskflow-${SERVICE}:${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  github_release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release after both images are published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" --verify-tag --generate-notes
